[package]
name = "ccresdoc-host-domain"
version = "0.0.0"
edition = "2021"
publish = false
description = "Cloud test boundary: compiles the Tauri host's platform-independent settings and appearance modules without Tauri."

[lib]
# The modules below are the production sources of src-tauri; this crate adds
# no implementation of its own.
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml_edit = "0.22"
url = "2"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
