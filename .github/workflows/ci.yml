name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, "base/**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend published-toolchain gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The app intentionally consumes the npm-published native zfb package.
      # No private sibling checkout or local upstream build is required.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies (frozen)
        run: pnpm --dir app install --frozen-lockfile

      - name: Validate package and installed-tree pins
        run: pnpm --dir app run validate:dependencies

      - name: Strict TypeScript
        run: pnpm --dir app run typecheck

      - name: zfb check
        run: pnpm --dir app run check:zfb

      - name: Frontend tests
        run: pnpm --dir app run test:run

      - name: Native zfb build
        run: pnpm --dir app exec zfb build

      - name: Pruned runtime workspace lifecycle
        run: pnpm run probe:runtime-package

      - name: Frozen zero-plugin compatibility fixture
        run: pnpm run check:compatibility

  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable # pinned-by-policy exception: dtolnay/rust-toolchain is tag-versioned; no stable commit SHA convention exists for this action
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: cargo fmt --check
        run: cargo fmt --check

      # Exclude the src-tauri crate (`ccresdoc`) from Linux CI: tauri v2 pulls
      # in webkit2gtk / gtk3 system libs that aren't on ubuntu-latest by default.
      # The Tauri host is verified locally via `cargo tauri build` (mac-only).
      # The only library crate is `ccresdoc-claude-md` (the ~/.claude→MDX
      # generator + watcher); it is pure Rust and runs cleanly on any platform.
      - name: cargo clippy --workspace --exclude ccresdoc --all-targets
        run: cargo clippy --workspace --exclude ccresdoc --all-targets -- -D warnings

      - name: cargo test --workspace --exclude ccresdoc
        run: cargo test --workspace --exclude ccresdoc
