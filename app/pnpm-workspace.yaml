# app/ is intentionally a standalone project: the Tauri host copies this complete
# node_modules tree into a writable workspace. Keep the linker and release-age
# policy in this file so pnpm 10 applies them to the standalone lockfile.
nodeLinker: hoisted

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@takazudo/zfb@2.7.1'
  - '@takazudo/zfb-darwin-arm64@2.7.1'
  - '@takazudo/zfb-darwin-x64@2.7.1'
  - '@takazudo/zfb-linux-arm64-gnu@2.7.1'
  - '@takazudo/zfb-linux-x64-gnu@2.7.1'
  - '@takazudo/zfb-md-wasm@2.7.1'
  - '@takazudo/zfb-runtime@2.7.1'
  - '@takazudo/zfb-win32-x64-msvc@2.7.1'
  - '@takazudo/zudo-doc@5.7.0'
